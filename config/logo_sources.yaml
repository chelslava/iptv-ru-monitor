# Источники логотипов.
#
# Проверено 2026-11-09: основной поток логотипов — метаданные самих
# M3U-источников (tvg-logo), покрытие ~89% каталога; URL нормализуются
# из протоколо-относительных «//host/…» в «https://…» (normalization).
# Репозиторий iptv-org/logo не существует (404) — паттерн-источник убран.
#
# Логотипы не копируются в публичный каталог: хранится URL и происхождение
# изображения (архитектура §10). Шаблонные источники подключаются при
# появлении проверенных (type: url_pattern, url_template с {tvg_id}).

logo_sources: []

