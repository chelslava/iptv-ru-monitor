# Источники IPTV-потоков.
#
# Поля:
#   id            — уникальный идентификатор источника
#   adapter       — адаптер discovery: iptv_org | free_tv | custom_m3u | remote_m3u
#   enabled       — участвует ли источник в сборе
#   country       — ISO 3166-1 alpha-2 (фильтр/метка)
#   public_policy — политика публикации потоков источника:
#                     allow  — потоки могут попадать в публичные сборки (лицензия явно
#                              разрешает переиспользование)
#                     review — публикация только после подтверждения
#                              (data/state/approved_streams.yaml; PR от workflow
#                              approve-candidates)
#                     deny   — никогда не публиковать
#   url / path    — адрес (M3U) или локальный файл
#   refresh_hours — желаемый период обновления
#
# Порядок важен для воспроизводимости ротации (issues #16/#17): срезы
# проверок (github-runner — каждые 6 часов, home-ru — ночью) выбираются
# stride'ом по порядку каталога, который определяется порядком источников
# здесь. Меняйте порядок осознанно — сместятся все слоты ротации.
#
# URL, лицензию и условия использования каждого источника проверять перед
# включением (см. docs/SOURCE_POLICY.md — там же реестр с датами проверки).

sources:
  - id: iptv-org-ru
    adapter: iptv_org
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://iptv-org.github.io/iptv/countries/ru.m3u"

  - id: ngrch-ru
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://ngrch.github.io/iptv/ru.m3u"
    # Проверено 2026-11-09: 978 записей, RU-каталог (Первый, Россия 1,
    # региональные), tvg-id у ~21%, 3 секретных URL (отсечёт политика).

  - id: iptvmir-mega
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://raw.githubusercontent.com/IPTVRU2026/IPTVMIR/main/IPTV_MEGA_PLAYLIST.m3u"
    # Проверено 2026-11-09: 8040 записей, мега-агрегатор (внутри iptv-org,
    # Rafail1982, M3U.SU и др.); много нероссийского контента и 393
    # секретных URL (автоматически исключаются публикацией). Каталог
    # растёт до ~9k потоков — concurrency поднят до 16 в app.yaml.

  - id: loganet
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://loganettv.vercel.app/all.m3u"
    # 2026-11-09: отвечает 402 Payment Required (тариф vercel-приложения
    # исчерпан) — включён: ошибка источника не валит discovery, подхватится
    # при восстановлении.

  - id: free-tv
    adapter: free_tv
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_russia.m3u8"
    # Проверено 2026-11-09: LICENSE у репозитория отсутствует (права на данные
    # неясны -> review), курируется против платных подписок; 59 записей
    # (group-title="Russia"), маркеры Ⓢ/Ⓖ в названиях очищаются clean_display_name.

  - id: custom-local
    adapter: custom_m3u
    enabled: true
    country: RU
    public_policy: deny # собственные списки по умолчанию не публикуются
    path: "data/input/custom.m3u"
    refresh_hours: 0
