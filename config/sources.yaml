# Источники IPTV-потоков.
#
# Поля:
#   id            — уникальный идентификатор источника
#   adapter       — адаптер discovery: iptv_org | free_tv | custom_m3u | remote_m3u
#   enabled       — участвует ли источник в сборе
#   country       — ISO 3166-1 alpha-2 (фильтр/метка)
#   public_policy — политика публикации потоков источника:
#                     allow  — потоки могут попадать в публичные сборки (лицензия явно
#                              разрешает переиспользование)
#                     review — публикация только после подтверждения
#                              (data/state/approved_streams.yaml; PR от workflow
#                              approve-candidates)
#                     deny   — никогда не публиковать
#   url / path    — адрес (M3U) или локальный файл
#   refresh_hours — желаемый период обновления
#
# Порядок важен для воспроизводимости ротации (issues #16/#17): срезы
# проверок (github-runner — каждые 6 часов, home-ru — ночью) выбираются
# stride'ом по порядку каталога, который определяется порядком источников
# здесь. Меняйте порядок осознанно — сместятся все слоты ротации.
#
# URL, лицензию и условия использования каждого источника проверять перед
# включением (см. docs/SOURCE_POLICY.md — там же реестр с датами проверки).

sources:
  - id: iptv-org-ru
    adapter: iptv_org
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://iptv-org.github.io/iptv/countries/ru.m3u"

  - id: ngrch-ru
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://ngrch.github.io/iptv/ru.m3u"
    # Проверено 2026-11-09: 978 записей, RU-каталог (Первый, Россия 1,
    # региональные), tvg-id у ~21%, 3 секретных URL (отсечёт политика).

  - id: iptvmir-mega
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://raw.githubusercontent.com/IPTVRU2026/IPTVMIR/main/IPTV_MEGA_PLAYLIST.m3u"
    # Проверено 2026-11-09: 8040 записей, мега-агрегатор (внутри iptv-org,
    # Rafail1982, M3U.SU и др.); много нероссийского контента и 393
    # секретных URL (автоматически исключаются публикацией). Каталог
    # растёт до ~9k потоков — concurrency поднят до 16 в app.yaml.

  - id: loganet
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://loganettv.vercel.app/all.m3u"
    # 2026-11-09: отвечает 402 Payment Required (тариф vercel-приложения
    # исчерпан) — включён: ошибка источника не валит discovery, подхватится
    # при восстановлении.

  - id: free-tv
    adapter: free_tv
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_russia.m3u8"
    # Проверено 2026-11-09: LICENSE у репозитория отсутствует (права на данные
    # неясны -> review), курируется против платных подписок; 59 записей
    # (group-title="Russia"), маркеры Ⓢ/Ⓖ в названиях очищаются clean_display_name.

  - id: goodtv
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://raw.githubusercontent.com/Alexander2045820/GoodTV/main/GoodTV/GoodTV.m3u"
    # Проверено 2026-11-16: 688 записей (155 региональных, федеральные, кино,
    # новости, музыка, радио, детские), 0 секретных URL, UTF-8, хосты
    # rutube/ngenix/catcast/ntv — без зеркал платных сервисов. Лицензия MIT
    # (репозиторий Alexander2045820/GoodTV, обновляется ежедневно). Группа
    # «Взрослые 18+» (~37 каналов) классифицируется категорией adult и
    # исключается из публичных сборок (exclude_categories в профилях);
    # публикация каждого потока всё равно требует approval.

  - id: artem-ru
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://raw.githubusercontent.com/artem-art998/IPTVru/main/iptv126.m3u"
    # Проверено 2026-11-16: 317 записей без group-title/tvg-id (категории
    # определятся по имени), ~7 секретных URL отсекаются политикой. Ценность —
    # нишевые региональные (Тыва, Томское время, Надежда, Союз). Хосты
    # смешанные (rutube, ttk.mx, vintera, личные домены). Лицензии у
    # репозитория нет — только review; репозиторий активен (обновления
    # еженедельно).

  - id: substanc-ru
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://raw.githubusercontent.com/substanc1/iptv-russia/main/streams/ru.m3u"
    # Проверено 2026-11-16: 686 записей, tvg-id у 99% (хорошее сопоставление
    # EPG), group-title отсутствует — категории по имени канала. Хосты — общий
    # пул бесплатных CDN (mcquack, uplink.kz, cinerama.uz, smotrim) + ~73
    # секретных URL (fs.uplink.kz?token=...) отсекаются политикой; ~2.6%
    # записей — зеркала платных каналов (365 дней, Amedia Hit, Dom Kino
    # Premium) — плотность сопоставима с уже включёнными источниками, каждый
    # поток публикуется только через approval. Лицензия Unlicense. Репозиторий
    # активен (обновление 2026-11-15). Даёт ~200 новых URL (~29% списка).

  - id: tvrus-ru
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://raw.githubusercontent.com/tv-rus/tv-rus.github.io/main/docs/playlists/all.m3u"
    # Проверено 2026-11-16: 304 записи, 100% с tvg-id и group-title
    # (федеральные/региональные/кино/новости...), 2 секретных URL. Хосты —
    # mcquack, smotrim, ntv.ru, 31.148.x — без операторов платных сервисов.
    # LICENSE у репозитория нет — только review; разливается через GitHub
    # Pages (tv-rus.github.io), raw-ссылка стабильна. Репозиторий активен
    # (2026-11-14), молодой (создан 2026-11-10). Список на ~91% дублирует
    # каталог (порядок ротации ставит его последним): после discover
    # 2026-11-16 закреплён 1 поток, остальные URL принадлежат более ранним
    # источникам; ценность — курируемые tvg-id/group-title и независимое
    # обновление (забирает URL, если ранние источники их потеряют).

  - id: dvinov-spb
    adapter: remote_m3u
    enabled: true
    country: RU
    public_policy: review
    refresh_hours: 24
    url: "https://raw.githubusercontent.com/dvinokurov80/iptv-russia-spb/main/playlist.m3u"
    # Проверено 2026-11-16: 215 записей (общероссийские + петербургские и
    # региональные: Тува, vod.tuva.ru, terra), group-title 100%, tvg-id 72%,
    # ~13 секретных URL отсекаются политикой. Хосты — mcquack, catcast,
    # uplink.kz, 88.212.15.50 — без операторов платных сервисов. LICENSE
    # отсутствует — только review. Репозиторий активен (обновление
    # 2026-11-16). На ~98% дублирует каталог (последний в порядке ротации):
    # после discover 2026-11-16 закреплено 4 потока; ценность — СПб/реги-
    # ональная курируемость и независимое обновление.

  - id: custom-local
    adapter: custom_m3u
    enabled: true
    country: RU
    public_policy: deny # собственные списки по умолчанию не публикуются
    path: "data/input/custom.m3u"
    refresh_hours: 0
