# Основные настройки приложения.
# Значения из этого файла переопределяются переменными окружения IPTV_* (см. .env.example).

app:
  name: iptv-ru-monitor
  log_level: INFO

paths:
  data_dir: data
  dist_dir: dist

# Точка наблюдения по умолчанию: local | github-runner | ru-vds.
probe_location: local

check:
  # 16 параллельных запросов: каталог вырос до ~9k потоков после
  # подключения агрегаторов (ngrch, IPTVMIR). Для VDS можно снизить.
  concurrency: 16
  max_redirects: 5
  http_timeout_seconds: 10.0
  hls_timeout_seconds: 15.0
  segment_timeout_seconds: 10.0
  # Сколько байт читать на уровне HTTP — защита от «бесконечных» MPEG-TS ответов.
  head_bytes: 65536
  ffprobe_timeout_seconds: 30.0
  playback_duration_seconds: 10.0
  user_agent: "iptv-ru-monitor/0.1"
  # UA-fallback (issue #18): при http 401/403/444 — повтор с браузерным UA.
  # ~15% каталога отвечало 403 плеерному агенту (замер 2026-11-09); такие
  # потоки публикуются с директивами #EXTVLCOPT/#KODIPROP (VLC/Kodi);
  # TiviMate задаёт UA настройкой плейлиста — рекомендация в README.
  ua_fallback: true
  browser_user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  # Повтор транзиентных ошибок уровня HTTP (issue #24): timeout и
  # transport_error — одна повторная попытка, чтобы разовый сбой сети
  # не считался провалом в uptime-статистике.
  retry_transient: true
  # DVR-проба Flussonic (issue #10): включена в безопасном скоупе —
  # только для approved-потоков (~100 шт., по 2 запроса после успешного
  # базового чека). Собирает dvr/dvr_hours в историю; при накоплении
  # данных в плейлисте появятся catchup-атрибуты TiviMate.
  dvr_probe: true
  dvr_probe_scope: approved

storage:
  # jsonl | sqlite
  backend: jsonl
  jsonl_path: data/state/checks.jsonl
  sqlite_path: data/state/history.sqlite

retention:
  # Фактическое окно истории = 30 дней: артефакты проверок живут 30 дней,
  # файлы probe/ru — последние 30 ночей (issue #13), файлы history/global —
  # последние 30 дней (issue #16). Раньше конфиг обещал 90, реальность
  # давала ~30 — теперь docs и факты совпадают.
  history_days: 30
  max_results_per_stream: 200

lifecycle:
  # Автодеградация мёртвых потоков (issue #8). Провалы подряд считаются
  # по всем точкам наблюдения от самой свежей проверки; один успех
  # сбрасывает счётчик (поток реанимируется автоматически).
  # С ротацией каталога (issue #16) каждый поток проверяется ~1 раз
  # в сутки, поэтому пороги считаются в сутках, а не в полусуточных
  # циклах, как до ротации (было 6/12 ≈ 1.5/3 суток).
  stale_consecutive_failures: 4   # ~4 суток провалов — пометка stale в отчёте
  deny_consecutive_failures: 8    # ~8 суток — исключение из плейлиста

scoring:
  # Минимальное число проверок для рейтинга; иначе — статус Insufficient data.
  min_checks: 5

geo:
  # Необязательный сервис определения страны точки наблюдения.
  ip_info_url: "https://ipinfo.io/json"

epg:
  # Нечёткое сопоставление имён каналов с EPG (issue #22): rapidfuzz
  # token_sort_ratio, порог 0-100; 0 — выключено. Неоднозначные кандидаты
  # (два EPG-канала с разницей < 3 баллов) не применяются автоматически
  # и попадают в отчёт enrich. Уверенность fuzzy держится ниже моста имён.
  fuzzy_threshold: 85.0
