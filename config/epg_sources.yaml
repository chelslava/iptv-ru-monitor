# Источники XMLTV (EPG).
# Проверены 2026-11-09:
#   - iptv-org/epg: репозиторий-ИНСТРУМЕНТ (Node.js, Unlicense), готовые
#     гайды не хостятся (ru.xml -> 404, публичные инстансы из GUIDES.md
#     мертвы) — не подключается как URL-источник;
#   - epg.pw: рабочий XMLTV по странам, gzip-файл ~3.2 МБ; числовые id
#     каналов + display-name на русском (сопоставление по нормализованному
#     имени); явной лицензии на данные нет — условия фиксируются в реестре
#     docs/SOURCE_POLICY.md.

epg_sources:
  - id: epg-pw-ru
    enabled: true
    format: xmltv
    url: "https://epg.pw/xmltv/epg_RU.xml.gz"
    trust_level: 0.6
    license_note: >
      Публичный бесплатный телегайд; явная лицензия на данные отсутствует.
      Программы перепубликуются в dist/ru/russia.xml как сверка данных
      мониторинга; правовой статус — см. реестр источников.
