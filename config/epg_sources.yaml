# Источники XMLTV (EPG).
# URL, полноту покрытия каналов и условия использования проверять перед
# включением (см. docs/SOURCE_POLICY.md). Успешное сопоставление не даёт
# права на публикацию, если лицензия источника не позволяет переиспользование.

epg_sources:
  - id: iptv-org-ru
    enabled: false # включить после проверки фактического URL и условий
    format: xmltv
    url: "https://iptv-org.github.io/epg/ru.xml"
    trust_level: 0.8
    license_note: "Гайды сообщества iptv-org; проверить условия перед включением"
