# Профиль страны RU. Логика стран не зашита в код: добавление второго файла
# в config/countries/ расширяет систему на новую страну.

country: RU
name: Россия
languages: [ru]

# Плейлисты, генерируемые для страны (профили — config/quality_profiles.yaml).
playlists:
  - profile: ru_default
    filename: russia.m3u
    title: "Россия — основной плейлист"
  - profile: ru_hd
    filename: russia-hd.m3u
    title: "Россия — HD"
  - profile: ru_kids
    filename: russia-kids.m3u
    title: "Россия — детские"
  - profile: ru_sport
    filename: russia-sport.m3u
    title: "Россия — спорт"

epg_filename: russia.xml

# Ручные номера каналов (tvg-chno, issue #7): резервируются до hash-нумерации
# остальных. Ключ сопоставляется с именем канала по нормализованной подстроке.
channel_numbers:
  "Первый канал": 1
  "Россия 1": 2
  "Матч ТВ": 3
  "НТВ": 4
  "Пятый канал": 5
  "Россия К": 6
  "Карусель": 7
  "ТВ-3": 8

# Ручные алиасы EPG: каноническое название -> tvg_id источника XMLTV.
# ВАЖНО: алиас применяется только если его tvg_id есть в активном EPG
# (формат id у провайдеров разный: iptv-org — «1tv.ru», epg.pw — числовые).
# Для epg.pw сопоставление идёт по нормализованным display-name; алиасы
# ниже рассчитаны на формат iptv-org и автоматически пропускаются.
aliases:
  - name: "Первый канал"
    tvg_id: "1tv.ru"
    manual: true
  - name: "Россия 1"
    tvg_id: "russia1.ru"
    manual: true
  - name: "Матч ТВ"
    tvg_id: "matchtv.ru"
    manual: true
