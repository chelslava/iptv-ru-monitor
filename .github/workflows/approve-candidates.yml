name: Approve candidates

# Автоматическая подготовка кандидатов на подтверждение публикации:
# поток с рейтингом, проверенный из двух точек наблюдения и отдавший
# HLS-сегмент. Create PR -> человек ревьюит diff и мержит.
# Merge PR = подтверждение; следующая сборка включает потоки в плейлисты.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *" # ежедневно после сборки плейлистов (время не гарантировано)

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: approve-candidates
  cancel-in-progress: false

jobs:
  propose:
    name: Propose approval candidates
    runs-on: ubuntu-latest
    env:
      BRANCH: chore/approve-candidates
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Merge check history
        run: bash scripts/merge_history.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refresh catalog
        run: uv run iptv-monitor discover
        env:
          IPTV_PROBE_LOCATION: github-runner

      - name: Generate candidates and apply
        run: uv run iptv-monitor candidates --country RU --apply

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/state/approved_streams.yaml; then
            echo "Нет новых кандидатов — PR не требуется"
            exit 0
          fi
          git config user.name "iptv-ru-monitor bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/state/approved_streams.yaml
          ADDED=$(git diff --cached --numstat | awk '{print $1}')
          git commit -m "chore(approval): +${ADDED} candidate streams"
          git push origin "$BRANCH" --force-with-lease

          python - <<'PY' > pr_body.md
          import json

          candidates = json.load(open("data/state/candidates.json", encoding="utf-8"))
          lines = [
              "Автоматически подготовленные кандидаты на подтверждение публикации.",
              "",
              "Критерии: score >= 75, проверок >= 6, успех минимум из двух точек",
              "наблюдения, HLS-сегмент получен (`config/quality_profiles.yaml -> approval`).",
              "",
              "| Канал | stream_id | Score | Уровень | Проверок | Точки |",
              "|---|---|---|---|---|---|",
          ]
          for c in candidates:
              lines.append(
                  f"| {c['channel']} | `{c['stream_id']}` | {c['score']} | "
                  f"{c['level']} | {c['checks']} | {', '.join(c['probe_locations'])} |"
              )
          lines += [
              "",
              "Merge PR = подтверждение; следующая сборка включит потоки в плейлисты.",
              "Полные данные: `iptv-monitor candidates` локально или `data/state/candidates.json`.",
          ]
          print("\n".join(lines))
          PY

          gh pr create \
            --base main --head "$BRANCH" \
            --title "chore(approval): кандидаты к публикации (${ADDED})" \
            --body-file pr_body.md \
            || echo "PR уже открыт — ветка обновлена push'ем"
