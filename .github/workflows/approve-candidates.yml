name: Approve candidates

# Автоматическая подготовка кандидатов на подтверждение публикации:
# поток с рейтингом, проверенный из двух точек наблюдения и отдавший
# HLS-сегмент. Create PR -> человек ревьюит diff и мержит.
# Merge PR = подтверждение; следующая сборка включает потоки в плейлисты.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *" # ежедневно после сборки плейлистов (время не гарантировано)

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: approve-candidates
  cancel-in-progress: false

jobs:
  propose:
    name: Propose approval candidates
    runs-on: ubuntu-latest
    env:
      BRANCH: chore/approve-candidates
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Merge check history
        run: bash scripts/merge_history.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refresh catalog
        run: uv run iptv-monitor discover
        env:
          IPTV_PROBE_LOCATION: github-runner

      - name: Generate candidates and apply
        run: uv run iptv-monitor candidates --country RU --apply

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/state/approved_streams.yaml; then
            echo "Нет новых кандидатов — PR не требуется"
            exit 0
          fi
          git config user.name "iptv-ru-monitor bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/state/approved_streams.yaml
          ADDED=$(git diff --cached --numstat | awk '{print $1}')
          git commit -m "chore(approval): +${ADDED} candidate streams"
          # Обновить remote-refs перед force-with-lease: shallow-checkout
          # не знает о состоянии ветки от предыдущих прогонов.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
          git push origin "$BRANCH" --force-with-lease

          # PR/issue группируются по источникам (max_per_run=100): ревью прав
          # масштабируется по источникам (4-5 шт.), а не по потокам.
          python - <<'PY' > pr_body.md
          import json
          from collections import defaultdict

          candidates = json.load(open("data/state/candidates.json", encoding="utf-8"))
          by_source = defaultdict(list)
          for c in candidates:
              by_source[c.get("source_id") or "unknown"].append(c)

          lines = [
              "Автоматически подготовленные кандидаты на подтверждение публикации.",
              "",
              f"Всего: **{len(candidates)}** (max_per_run=100). Критерии: score >= 75,",
              "проверок >= 6, успех минимум из двух точек наблюдения, HLS-сегмент",
              "получен (`config/quality_profiles.yaml -> approval`).",
              "",
              "**Merge PR = подтверждение** двух вещей:",
              "1. технического состояния потоков (таблицы ниже по источникам);",
              "2. прав **каждого источника** из списков — чек-лист и статус:",
              "[docs/SOURCE_POLICY.md → Реестр источников](../../blob/main/docs/SOURCE_POLICY.md#реестр-источников).",
              "",
              "| Источник | Кандидатов | Score | Таблица |",
              "|---|---|---|---|",
          ]
          for source in sorted(by_source):
              group = by_source[source]
              scores = [c["score"] for c in group]
              lines.append(
                  f"| `{source}` | {len(group)} | {min(scores)}–{max(scores)} | ниже |"
              )
          lines.append("")
          for source in sorted(by_source):
              group = by_source[source]
              lines.append(f"### Источник `{source}` — {len(group)} шт.")
              lines.append("")
              lines.append("| Канал | stream_id | Score | Уровень | Проверок | Точки |")
              lines.append("|---|---|---|---|---|---|")
              for c in group:
                  lines.append(
                      f"| {c['channel']} | `{c['stream_id']}` | {c['score']} | "
                      f"{c['level']} | {c['checks']} | {', '.join(c['probe_locations'])} |"
                  )
              lines.append("")
          lines += [
              "Следующая сборка включит потоки в плейлисты. Полные данные:",
              "`iptv-monitor candidates` локально или `data/state/candidates.json`.",
          ]
          print("\n".join(lines))
          PY

          # Тело issue генерируется заранее: терминатор heredoc должен быть
          # на базовом уровне отступа, внутри if/else это невозможно.
          python - <<'PY' > issue_body.md
          import json
          import os
          from collections import defaultdict

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["BRANCH"]
          candidates = json.load(open("data/state/candidates.json", encoding="utf-8"))
          by_source = defaultdict(list)
          for c in candidates:
              by_source[c.get("source_id") or "unknown"].append(c)

          lines = [
              "Автоматически подготовленные кандидаты на подтверждение публикации.",
              "",
              f"Всего: **{len(candidates)}** (max_per_run=100). Критерии: score >= 75,",
              "проверок >= 6, успех минимум из двух точек наблюдения, HLS-сегмент",
              "получен (`config/quality_profiles.yaml -> approval`).",
              "",
              "| Источник | Кандидатов | Score |",
              "|---|---|---|",
          ]
          for source in sorted(by_source):
              group = by_source[source]
              scores = [c["score"] for c in group]
              lines.append(f"| `{source}` | {len(group)} | {min(scores)}–{max(scores)} |")
          lines += [
              "",
              "Полные таблицы по источникам — в PR (см. ссылку ниже). Чек-лист прав",
              "каждого источника: [docs/SOURCE_POLICY.md → Реестр источников](../../blob/main/docs/SOURCE_POLICY.md#реестр-источников).",
              "",
              "**Подтверждение:** откройте PR по ссылке, проверьте diff и чек-лист прав",
              "в docs/SOURCE_POLICY.md, затем смержите — следующая сборка включит",
              "потоки в плейлисты:",
              f"https://github.com/{repo}/compare/{branch}...{branch}?expand=1",
              "",
              "_Чтобы workflow сразу создавал PR: Settings → Actions → General →",
              "«Allow GitHub Actions to create and approve pull requests»._",
          ]
          print("\n".join(lines))
          PY

          if gh pr create \
            --base main --head "$BRANCH" \
            --title "chore(approval): кандидаты к публикации (${ADDED})" \
            --body-file pr_body.md; then
            echo "PR создан"
          else
            echo "Создание PR запрещено настройкой репозитория — оформляю issue"
            existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
              --search "in:title Кандидаты к публикации" --json number --jq '.[0].number // empty')
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" --body-file issue_body.md
            else
              gh issue create \
                --title "Кандидаты к публикации (требуется подтверждение)" \
                --body-file issue_body.md
            fi
          fi
