name: Check global

# Базовая проверка доступности с GitHub-hosted runner.
# Результаты маркируются probe_location=github-runner и НЕ считаются
# российской точкой проверки.
#
# Ротация каталога (issue #16): каждый 6-часовой прогон проверяет свою
# долю каталога (stride-срез `--rotate-offset/--rotate-parts`, PARTS=4);
# за сутки каждый поток получает одну проверку, весь каталог — четыре.
# Результаты постоянно накапливаются в ветке history/global (по одному
# gzip-файлу на прогон, файлы старше 30 дней удаляются при пуше), откуда
# их забирает scripts/merge_history.sh. Раньше история жила ~30 часов
# (последние 5 артефактов) — 94% каталога застревало в insufficient_data.

on:
  workflow_dispatch:
    inputs:
      levels:
        description: "Уровни проверки"
        default: "http,hls"
        required: false
        type: string
      parts:
        description: "Слотов ротации (1 = весь каталог без ротации)"
        default: "4"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *" # каждые 6 часов (время не гарантировано)

permissions:
  contents: write # пуш истории в ветку history/global (issue #16)
  issues: write # метка ci-failing на roadmap при падении (issue #11)

concurrency:
  group: check-global
  cancel-in-progress: false

jobs:
  check:
    name: HTTP/HLS check from GitHub runner
    runs-on: ubuntu-latest
    env:
      ROTATE_PARTS: ${{ inputs.parts || '4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Compute rotation slot
        # Детерминированный слот от времени: каждый 6-часовой интервал
        # проверяет свою долю каталога (10xx из 4 частей в сутки).
        run: echo "ROTATE_SLOT=$(( $(date -u +%s) / 21600 % ${ROTATE_PARTS} ))" >> "$GITHUB_ENV"

      - name: Refresh catalog
        run: uv run iptv-monitor discover
        env:
          IPTV_PROBE_LOCATION: github-runner

      - name: Check streams
        run: |
          FLAGS=""
          if [[ "$ROTATE_PARTS" -ge 2 ]]; then
            FLAGS="--rotate-offset $ROTATE_SLOT --rotate-parts $ROTATE_PARTS"
          fi
          uv run iptv-monitor check --levels ${{ inputs.levels || 'http,hls' }} \
            --probe-location github-runner $FLAGS
        env:
          IPTV_JSONL_PATH: data/state/checks-global.jsonl

      - name: Job summary
        if: always()
        run: |
          f=data/state/checks-global.jsonl
          {
            echo "## Check global"
            echo "Ротация: слот **$ROTATE_SLOT** из **$ROTATE_PARTS**"
            if [[ -f "$f" ]]; then
              total=$(wc -l < "$f")
              ok=$(grep -c '"error_code":null' "$f" || true)
              echo "Проверено: **$total**, успешно: **$ok**"
              echo
              echo '```'
              grep -o '"error_code":"[a-z_0-9]*"' "$f" | sort | uniq -c | sort -rn | head -10
              echo '```'
            else
              echo "Артефакт проверок не найден."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload check results
        uses: actions/upload-artifact@v4
        with:
          name: checks-global
          path: data/state/checks-global.jsonl
          retention-days: 30
          if-no-files-found: error

      - name: Persist history (branch history/global)
        # Постоянная история github-runner (issue #16): один gzip-файл
        # на прогон; merge_history.sh собирает всё окно retention.
        if: always()
        env:
          BRANCH: history/global
        run: |
          F=data/state/checks-global.jsonl
          if [[ ! -s "$F" ]]; then
            echo "Результатов нет — пуш истории пропущен"
            exit 0
          fi
          STAMP=$(date -u +%Y%m%d-%H%M)
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
          WORKTREE=$(mktemp -d)
          cleanup() { git worktree remove --force "$WORKTREE" 2>/dev/null || true; git worktree prune; }
          trap cleanup EXIT
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git worktree add -B "$BRANCH" "$WORKTREE" "origin/$BRANCH"
          else
            git worktree add --orphan -b "$BRANCH" "$WORKTREE"
          fi
          # run_id в имени файла: merge_history.sh отличает данные прогона,
          # уже лежащие в ветке, от его же артефакта (защита от дублей).
          gzip -c "$F" > "$WORKTREE/checks-global-$STAMP-r${GITHUB_RUN_ID}.jsonl.gz"
          # Ретенция в ветке: удаляем файлы старше 30 дней по дате в имени.
          # Git-команды — в подshell с cd: cwd родителя не меняется, иначе
          # cleanup-trap падает «Unable to read current working directory».
          CUTOFF=$(date -u -d "30 days ago" +%Y%m%d)
          (
            cd "$WORKTREE"
            for f in checks-global-*.jsonl.gz; do
              [[ -e "$f" ]] || continue
              d=$(sed -E 's/checks-global-([0-9]{8})-.*/\1/' <<<"$f")
              if (( d < CUTOFF )); then git rm -q "$f"; fi
            done
            git add -A
            if git diff --cached --quiet; then
              echo "Нет изменений в истории — пуш пропущен"
            else
              git config user.name "iptv-ru-monitor bot"
              git config user.email "bot@users.noreply.github.com"
              git commit -m "history: github-runner $STAMP (slot $ROTATE_SLOT/$ROTATE_PARTS, run ${GITHUB_RUN_ID})"
              git push origin "$BRANCH"
            fi
          )

      - name: Mark roadmap failing
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/4/labels" \
            -f "labels[]=ci-failing" >/dev/null

      - name: Clear roadmap failing label
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/4/labels/ci-failing" >/dev/null 2>&1 || true
