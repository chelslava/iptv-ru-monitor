name: Build playlists

# Объединение результатов проверок (GitHub runner + RU VDS),
# скоринг и генерация плейлистов/отчётов.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *" # ежедневно после проверок (время не гарантировано)

permissions:
  contents: read
  actions: read

concurrency:
  group: build-playlists
  cancel-in-progress: false

jobs:
  build:
    name: Merge results and build dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Merge check history
        # Артефакты check-global/check-ru + ветка probe/ru -> data/state/checks.jsonl
        run: bash scripts/merge_history.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refresh catalog and enrich
        run: |
          uv run iptv-monitor discover
          uv run iptv-monitor enrich
        env:
          IPTV_PROBE_LOCATION: github-runner

      - name: Score and build
        run: |
          uv run iptv-monitor score
          uv run iptv-monitor build --country RU

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
          if-no-files-found: error
