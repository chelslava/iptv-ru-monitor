name: Build playlists

# Объединение результатов проверок (GitHub runner + RU VDS),
# скоринг и генерация плейлистов/отчётов.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *" # ежедневно после проверок (время не гарантировано)

permissions:
  contents: read
  actions: read
  issues: write # метка ci-failing на roadmap при падении (issue #11)

concurrency:
  group: build-playlists
  cancel-in-progress: false

jobs:
  build:
    name: Merge results and build dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Merge check history
        # Артефакты check-global/check-ru + ветка probe/ru -> data/state/checks.jsonl
        run: bash scripts/merge_history.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Retention
        # Привести историю к configured-окну (issue #13): 30 дней / 200 на поток.
        run: uv run iptv-monitor retention

      - name: "Guard: home-ru freshness"
        # Ранний сигнал «ночной домашний прогон перестал приходить» (issue #11):
        # сборка краснеет, если данных home-ru нет дольше 36 часов.
        run: |
          f=data/state/checks.jsonl
          latest=$(grep '"probe_location":"home-ru"' "$f" \
            | grep -o '"checked_at":"[^"]*"' | sort | tail -1 | cut -d'"' -f4 || true)
          if [[ -z "$latest" ]]; then
            echo "::error::home-ru: данных нет вовсе — ночной домашний прогон не публиковался в probe/ru" >&2
            exit 1
          fi
          python3 - "$latest" <<'PY'
          import datetime, sys
          latest = datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          age_h = (datetime.datetime.now(datetime.timezone.utc) - latest).total_seconds() / 3600
          print(f"home-ru: последняя проверка {latest.isoformat()} ({age_h:.1f} ч назад)")
          if age_h > 36:
              sys.exit(f"::error::home-ru данные старше 36 ч ({age_h:.0f} ч) — домашний прогон молчит")
          PY

      - name: Refresh catalog and enrich
        run: |
          uv run iptv-monitor discover
          uv run iptv-monitor enrich
        env:
          IPTV_PROBE_LOCATION: github-runner

      - name: Score and build
        run: |
          uv run iptv-monitor score
          uv run iptv-monitor build --country RU

      - name: Job summary
        run: |
          cat > /tmp/build_summary.py <<'PY'
          import json
          report = json.load(open("dist/ru/report.json", encoding="utf-8"))
          s = report["summary"]
          print(f"Потоков всего: **{s['streams_total']}**, включено: **{s['streams_included']}**, исключено: {s['streams_excluded']}")
          print(f"Уровни: {s.get('levels', {})}")
          print(f"Точки наблюдения: {s.get('probe_locations', {})}")
          print(f"Жизненный цикл: stale **{s.get('lifecycle_stale', 0)}**, автодeny **{s.get('lifecycle_denied', 0)}**")
          top = s.get("top_error_codes") or {}
          if top:
              print(f"Топ ошибок: {top}")
          PY
          {
            echo "## Build playlists"
            python3 /tmp/build_summary.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Mark roadmap failing
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/4/labels" \
            -f "labels[]=ci-failing" >/dev/null

      - name: Clear roadmap failing label
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/4/labels/ci-failing" >/dev/null 2>&1 || true
